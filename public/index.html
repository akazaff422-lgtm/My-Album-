<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a30">
<title>JABED VAO Album Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120a30; --bg2:#1a0f45; --panel:#21155a; --panel2:#2a1b6e; --line:#43338c; --line2:#5a48b0;
  --text:#f5f1ff; --muted:#b5aae3; --dim:#8c80c4;
  --pink:#ff3d9a; --amber:#ffb020; --cyan:#22d3ee; --mint:#34e3a0; --violet:#8b5cf6; --coral:#ff6b4a; --lime:#b6f04a;
  --danger:#ff5d73; --ok:#34e3a0;
  --r:18px; --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"Outfit",system-ui,sans-serif;font-size:16px;line-height:1.45;color:var(--text);background:var(--bg);min-height:100vh;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:10px}

/* ---------- animated backdrop ---------- */
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(900px 600px at 50% 120%,rgba(139,92,246,.35),transparent 60%),var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:var(--pink);top:-120px;right:-100px}
.o2{width:340px;height:340px;background:var(--cyan);top:30%;left:-140px;animation-duration:22s;animation-delay:-6s}
.o3{width:300px;height:300px;background:var(--violet);bottom:-100px;right:10%;animation-duration:26s;animation-delay:-12s}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}

/* ---------- login ---------- */
#login{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{width:min(420px,100%);padding:26px 22px;border-radius:28px;background:rgba(33,21,90,.72);border:1px solid var(--line);
  backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.45);animation:rise .8s var(--ease) both}
.lcard h2{margin:18px 0 4px;font-family:"Unbounded",sans-serif;font-weight:700;font-size:22px}
.lcard p{margin:0 0 16px;color:var(--muted)}
.ownerbig{display:flex;align-items:center;gap:14px}
.avatar{position:relative;flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
.avatar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--amber),var(--pink),var(--cyan),var(--mint),var(--amber));animation:spin 9s linear infinite}
.avatar b{position:absolute;inset:4px;z-index:1;border-radius:50%;background:#fff;display:grid;place-items:center;color:#2a0d5e;
  font-family:"Unbounded",sans-serif;font-weight:800;font-size:24px}
.avatar.sm{width:44px;height:44px}.avatar.sm b{font-size:15px;inset:3px}
.crown{position:absolute;top:-17px;left:50%;margin-left:-14px;font-size:26px;z-index:3;font-style:normal;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
.avatar.sm .crown{font-size:17px;top:-12px;margin-left:-9px}
.badge{display:inline-block;padding:1px 12px;border-radius:99px;font-size:13px;font-weight:600;color:#1a0b3d;background:linear-gradient(90deg,var(--amber),var(--lime))}
.oname{margin:4px 0 0;font-family:"Unbounded",sans-serif;font-weight:800;font-size:clamp(20px,6vw,28px);line-height:1.1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}

/* ---------- controls ---------- */
.field{width:100%;padding:13px 15px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line);outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.15)}
.field::placeholder{color:var(--dim)}
textarea.field{resize:vertical;min-height:90px}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;font-weight:600;
  position:relative;overflow:hidden;transition:transform .15s var(--ease),filter .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.primary{color:#fff;background:linear-gradient(90deg,var(--pink),var(--coral));box-shadow:0 8px 24px rgba(255,61,154,.3)}
.btn.cyan{color:#10253a;background:linear-gradient(90deg,var(--cyan),var(--mint))}
.btn.amber{color:#2a1a00;background:linear-gradient(90deg,var(--amber),var(--lime))}
.btn.ghost{border:1.5px solid var(--line2);background:rgba(255,255,255,.03)}
.btn.danger{background:var(--danger);color:#fff}
.btn.full{width:100%}
.btn:hover{filter:brightness(1.08)}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.ib{width:38px;height:38px;border-radius:12px;display:inline-grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:transform .15s,background .2s,color .2s}
.ib:hover{background:rgba(255,255,255,.12)}.ib:active{transform:scale(.9)}
.ib.red:hover{background:var(--danger);color:#fff}

/* ---------- shell ---------- */
#shell{position:relative;z-index:1;display:none;min-height:100vh}
#shell.on{display:block}
.side{display:none}
.main{max-width:980px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(110px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:6px;padding:6px;border-radius:22px;
  background:rgba(26,15,69,.88);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:16px;font-size:12.5px;font-weight:600;color:var(--muted);transition:background .25s,color .25s}
.tab.on{background:linear-gradient(135deg,rgba(255,61,154,.25),rgba(139,92,246,.3));color:#fff}
@media(min-width:900px){
  .side{display:flex;flex-direction:column;gap:18px;position:fixed;top:0;bottom:0;left:0;width:250px;padding:22px 16px;border-right:1px solid var(--line);background:rgba(18,10,48,.72);backdrop-filter:blur(12px);z-index:5}
  .main{margin-left:250px;max-width:none;padding:28px 34px 60px}
  .main>.inner{max-width:900px;margin:0 auto}
  .tabs{display:none}
}
.sidehead{display:flex;align-items:center;gap:12px;padding:6px 4px 12px;border-bottom:1px solid var(--line)}
.sidehead b{font-family:"Unbounded",sans-serif;font-size:14px;display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--muted);font-weight:600;text-align:left;transition:background .2s,color .2s}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{color:#fff;background:linear-gradient(90deg,rgba(255,61,154,.28),rgba(139,92,246,.18))}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

/* ---------- pages ---------- */
.page{animation:pagein .45s var(--ease) both}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}}
.hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#3b1d8f 0%,#7a1fa2 48%,#ff3d9a 100%);box-shadow:0 16px 44px rgba(255,61,154,.25)}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero>*{position:relative;z-index:1}
.hero .sub{margin:2px 0 0;opacity:.9;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{border-radius:18px;padding:12px 14px;color:#1a0b3d;animation:pop .6s var(--ease) both}
.stat:nth-child(2){animation-delay:.08s}.stat:nth-child(3){animation-delay:.16s}
.stat b{display:block;font-family:"Unbounded",sans-serif;font-size:24px;line-height:1.1}
.stat span{font-size:13px;font-weight:600}
.s1{background:var(--cyan)}.s2{background:var(--amber)}.s3{background:var(--mint)}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:150px;position:relative}
.search svg{position:absolute;left:13px;top:50%;margin-top:-10px;color:var(--dim)}
.search .field{padding-left:42px}
h2.t{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-family:"Unbounded",sans-serif;font-size:18px}
.card{background:rgba(33,21,90,.7);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;backdrop-filter:blur(8px)}
.card h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:13.5px}

/* folder list */
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:8px;animation:rowin .5s var(--ease) both;animation-delay:calc(var(--i)*35ms)}
@keyframes rowin{from{opacity:0;transform:translateX(-18px)}}
.fmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;text-align:left;
  background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1.5px solid var(--line);border-left:5px solid var(--c);
  transition:transform .2s var(--ease),border-color .2s,background .2s}
.fmain:hover{transform:translateX(4px);border-color:var(--c);background:rgba(255,255,255,.08)}
.fmain:active{transform:scale(.98)}
.num{flex:none;min-width:34px;font-family:"Unbounded",sans-serif;font-weight:700;font-size:13px;color:var(--c)}
.ficon{flex:none;font-size:24px;width:34px;text-align:center}
.ftitle{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcount{flex:none;padding:0 11px;border-radius:99px;background:var(--c);color:#1a0b3d;font-weight:700;font-size:14px}
.fmain svg{color:var(--dim)}
.manage{display:flex;gap:6px}
.empty{text-align:center;padding:36px 12px;color:var(--muted);animation:pagein .5s var(--ease) both}
.empty .big{font-size:54px;animation:bob 3s ease-in-out infinite;display:block}
.empty h3{margin:8px 0 4px;color:var(--text);font-family:"Unbounded",sans-serif;font-size:18px}

/* folder view */
.fhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.fhead .ti{flex:1;min-width:0}
.fhead h2{margin:0;font-family:"Unbounded",sans-serif;font-size:clamp(17px,4.6vw,24px);display:flex;align-items:center;gap:10px}
.fhead h2 span.e{font-size:1.3em}
.drop{border:2px dashed var(--line2);border-radius:20px;padding:22px 14px;text-align:center;color:var(--muted);transition:background .2s,border-color .2s,transform .2s;cursor:pointer}
.drop:hover,.drop.over{background:rgba(34,211,238,.08);border-color:var(--cyan);transform:scale(1.01)}
.drop svg{width:34px;height:34px;color:var(--cyan)}
.mrow{display:grid;grid-template-columns:auto 76px 1fr;gap:12px;align-items:center;padding:10px;border-radius:18px;margin-bottom:10px;
  background:rgba(33,21,90,.7);border:1px solid var(--line);animation:rowin .45s var(--ease) both;animation-delay:calc(var(--i)*30ms);transition:border-color .2s}
.mrow:hover{border-color:var(--line2)}
.mnum{font-family:"Unbounded",sans-serif;font-weight:700;font-size:14px;color:var(--amber);min-width:30px}
.thumb{position:relative;width:76px;height:76px;border-radius:14px;overflow:hidden;background:#0b0620;display:grid;place-items:center;cursor:pointer}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.28);transition:background .2s}
.thumb:hover .pl{background:rgba(0,0,0,.1)}
.thumb .pl svg{width:26px;height:26px;color:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.aud{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(135deg,var(--violet),var(--pink))}
.aud svg{width:30px;height:30px}
.minfo{min-width:0}
.minfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{display:inline-block;padding:0 9px;border-radius:8px;font-size:12px;font-weight:700;color:#1a0b3d;background:var(--c,var(--cyan));margin-right:6px}
.macts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
@media(min-width:700px){.mrow{grid-template-columns:auto 76px 1fr auto}.macts{grid-column:auto}}

/* upload page */
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);margin-bottom:14px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center;font-size:14.5px;transition:background .25s,color .25s}
.seg button.on{background:linear-gradient(90deg,var(--pink),var(--violet));color:#fff}
.cmd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);margin-bottom:8px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
.cmd code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:13.5px;font-weight:600;border:1px solid var(--line)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--danger);display:block}
.chip.ok i{background:var(--ok);box-shadow:0 0 10px var(--ok)}

/* tray / toast / modal / viewer */
#tray{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:460px;margin-left:auto;display:none}
#tray.on{display:block;animation:rise .4s var(--ease) both}
@media(min-width:900px){#tray{bottom:20px;right:20px;left:auto;width:400px}}
.trbox{border-radius:20px;background:rgba(26,15,69,.96);border:1px solid var(--line2);padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);backdrop-filter:blur(12px);max-height:42vh;overflow:auto}
.trhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.up{padding:8px 0;border-top:1px solid var(--line)}
.up:first-of-type{border-top:0}
.up .n{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.up .n span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--mint),var(--cyan));background-size:200% 100%;animation:shim 1.2s linear infinite;transition:width .25s}
.up.done .pb i{animation:none;background:var(--ok)}.up.err .pb i{animation:none;background:var(--danger)}
@keyframes shim{to{background-position:-200% 0}}
#toasts{position:fixed;z-index:60;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;max-width:460px;width:100%;padding:12px 16px;border-radius:16px;background:#fff;color:#1a0b3d;font-weight:600;display:flex;gap:10px;align-items:flex-start;box-shadow:0 14px 36px rgba(0,0,0,.4);animation:tin .45s var(--ease) both}
.toast.err{background:var(--danger);color:#fff}.toast.ok{background:var(--mint)}
.toast.out{animation:tout .3s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-20px) scale(.95)}}
@keyframes tout{to{opacity:0;transform:translateY(-14px)}}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,3,26,0);transition:background .25s;padding:0}
.modal.on{background:rgba(8,3,26,.7)}
.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .35s var(--ease)}
.modal.on .sheet{transform:none}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:26px;transform:translateY(30px) scale(.96);opacity:0;transition:transform .35s var(--ease),opacity .25s}.modal.on .sheet{opacity:1}}
.sheet h3{margin:0 0 12px;font-family:"Unbounded",sans-serif;font-size:17px}
.sheet .row{display:flex;gap:10px;margin-top:14px}
.sheet .row .btn{flex:1}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.emo button{font-size:22px;padding:6px 0;border-radius:12px;border:1.5px solid transparent;background:var(--bg2);transition:transform .15s}
.emo button:hover{transform:scale(1.15)}.emo button.on{border-color:var(--pink);background:rgba(255,61,154,.2)}
.plist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.plist button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);text-align:left;transition:border-color .2s}
.plist button:hover{border-color:var(--cyan)}
.viewer{position:fixed;inset:0;z-index:55;background:rgba(5,2,18,.94);display:flex;flex-direction:column;opacity:0;transition:opacity .25s}
.viewer.on{opacity:1}
.vtop{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.vtop b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbody{flex:1;min-height:0;display:grid;place-items:center;padding:0 10px}
.vbody video,.vbody img{max-width:100%;max-height:100%;border-radius:14px}
.vbody audio{width:min(480px,100%)}
.vnav{display:flex;justify-content:center;gap:14px;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.skel{height:60px;border-radius:18px;margin-bottom:10px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- cinematic intro ---------- */
#intro{position:fixed;inset:0;z-index:100;overflow:hidden;display:grid;place-items:center;background:radial-gradient(900px 600px at 50% 50%,#1d1048 0%,#0a0420 60%,#05020f 100%);
  transition:opacity .7s ease,transform .7s var(--ease),filter .7s ease}
#intro.out{opacity:0;transform:scale(1.18);filter:blur(10px);pointer-events:none}
#introCv{position:absolute;inset:0;width:100%;height:100%}
.ibeam{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,#fff,var(--cyan),var(--pink),transparent);
  box-shadow:0 0 30px 6px rgba(34,211,238,.6),0 0 60px 12px rgba(255,61,154,.4);transform:scaleX(0);opacity:1;animation:beam 1.1s var(--ease) .15s both,beamfade .8s ease 1.2s forwards}
@keyframes beam{0%{transform:scaleX(0)}60%{transform:scaleX(1);height:2px}100%{transform:scaleX(1);height:2px}}
@keyframes beamfade{to{opacity:0;transform:scaleX(1) scaleY(18)}}
.istage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px}
.iav{position:relative;width:112px;height:112px;display:grid;place-items:center;opacity:0;animation:avin .9s var(--ease) 1.0s both}
.iring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--amber),var(--pink),var(--cyan),var(--mint),var(--amber));animation:spin 4s linear infinite;box-shadow:0 0 50px rgba(255,61,154,.55)}
.iav b{position:absolute;inset:6px;z-index:1;border-radius:50%;background:#fff;display:grid;place-items:center;color:#2a0d5e;font-family:"Unbounded",sans-serif;font-weight:800;font-size:38px}
.icrown{position:absolute;z-index:3;top:-34px;left:50%;margin-left:-22px;font-size:44px;font-style:normal;opacity:0;animation:crown 1s cubic-bezier(.34,1.56,.64,1) 1.35s both;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
@keyframes avin{from{opacity:0;transform:scale(.2) rotate(-120deg)}to{opacity:1;transform:none}}
@keyframes crown{from{opacity:0;transform:translateY(-160px) rotate(-30deg)}60%{opacity:1}to{opacity:1;transform:translateY(0) rotate(-8deg)}}
.iname{margin:26px 0 0;font-family:"Unbounded",sans-serif;font-weight:800;font-size:clamp(28px,9vw,52px);letter-spacing:2px;line-height:1.1;display:flex;flex-wrap:wrap;justify-content:center;color:#fff}
.iname .ch{display:inline-block;min-width:.28em;opacity:0;text-shadow:0 0 24px rgba(255,61,154,.9),0 0 50px rgba(139,92,246,.7);animation:chin .8s var(--ease) both;animation-delay:calc(1.9s + var(--n)*75ms)}
@keyframes chin{from{opacity:0;transform:translateY(34px) scale(1.5);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
.ibadge{margin-top:16px;padding:3px 18px;border-radius:99px;font-weight:700;color:#1a0b3d;background:linear-gradient(90deg,var(--amber),var(--lime));opacity:0;animation:slideb .7s var(--ease) 2.9s both}
@keyframes slideb{from{opacity:0;transform:translateX(-40px) scale(.8)}to{opacity:1;transform:none}}
.isub{margin-top:14px;font-weight:600;color:var(--muted);letter-spacing:14px;opacity:0;animation:subin 1.1s var(--ease) 3.1s both;font-size:14px}
@keyframes subin{from{opacity:0;letter-spacing:22px;filter:blur(6px)}to{opacity:1;letter-spacing:7px;filter:blur(0)}}
.iload{margin-top:30px;width:min(260px,70vw);height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;opacity:0;animation:fadein .5s ease 3.2s both}
.iload i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--amber),var(--cyan),var(--mint));box-shadow:0 0 14px var(--cyan)}
.ipct{margin-top:8px;font-family:"Unbounded",sans-serif;font-size:12px;color:var(--muted);opacity:0;animation:fadein .5s ease 3.2s both}
@keyframes fadein{to{opacity:1}}
.iskip{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));right:14px;padding:8px 16px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--muted);font-weight:600;font-size:14px;opacity:0;animation:fadein .5s ease 1s both}
.reveal{animation:reveal .8s var(--ease) both}
@keyframes reveal{from{opacity:0;transform:scale(1.05);filter:blur(10px)}}

/* storage meters */
.meter{margin-bottom:16px}.meter:last-child{margin-bottom:0}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.mbar{height:14px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.mbar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s var(--ease);background:linear-gradient(90deg,var(--mint),var(--cyan))}
.mbar i.warn{background:linear-gradient(90deg,var(--amber),var(--coral))}
.mbar i.bad{background:linear-gradient(90deg,var(--coral),var(--danger))}
.mf{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted)}
.mrow2{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-bottom:8px}

/* library dashboard */
.lib{padding:18px}
.libtop{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.dw{position:relative;flex:none;width:132px;height:132px}
.donut{width:100%;height:100%}
.donut circle.seg{transition:stroke-dasharray 1.3s var(--ease)}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dc b{font-family:"Unbounded",sans-serif;font-size:26px;line-height:1}
.dc span{font-size:12.5px;color:var(--muted);margin-top:2px}
.li{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:18px;text-align:left;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,transparent),rgba(255,255,255,.03));border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);
  animation:pop .6s var(--ease) both;transition:transform .2s var(--ease)}
.tile:nth-child(2){animation-delay:.06s}.tile:nth-child(3){animation-delay:.12s}.tile:nth-child(4){animation-delay:.18s}.tile:nth-child(5){animation-delay:.24s}.tile:nth-child(6){animation-delay:.3s}
.tile:hover{transform:translateY(-3px)}.tile:active{transform:scale(.96)}
.tile .tic{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--c);color:#1a0b3d;margin-bottom:4px}
.tile b{font-family:"Unbounded",sans-serif;font-size:22px;line-height:1.1}
.tile .tl{font-size:13.5px;font-weight:600;color:var(--text)}
.tile small{color:var(--muted);font-size:12px}
.tc{display:inline-flex;align-items:center;gap:4px;padding:1px 9px 1px 7px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tc svg{width:13px;height:13px}
.fsub{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.ftitle{white-space:normal}
.tcrow{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.rstrip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px 8px;scroll-snap-type:x proximity}
.rstrip::-webkit-scrollbar{display:none}
.rcard{flex:none;width:112px;scroll-snap-align:start;cursor:pointer;animation:pop .5s var(--ease) both}
.rcard .thumb{width:112px;height:112px;border:2px solid var(--c)}
.rl{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:13px;font-weight:600}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:0 -2px 12px;padding:2px}
.fchips::-webkit-scrollbar{display:none}
.fc{flex:none;padding:7px 14px;border-radius:99px;font-weight:600;font-size:14px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);transition:background .2s,border-color .2s}
.fc b{margin-left:4px;color:var(--c)}
.fc.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mcard{position:relative;padding:8px;border-radius:18px;background:rgba(33,21,90,.7);border:1.5px solid color-mix(in srgb,var(--c) 50%,var(--line));animation:pop .45s var(--ease) both;animation-delay:calc(var(--i)*30ms)}
.mcard .thumb{width:100%;height:auto;aspect-ratio:1/1}
.mcard .bn{position:absolute;top:14px;left:14px;z-index:2;padding:0 9px;border-radius:99px;background:rgba(10,4,32,.78);font-family:"Unbounded",sans-serif;font-size:12px;font-weight:700;color:var(--amber)}
.mcard .kt{margin:8px 2px 6px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.mcard .macts .ib{width:34px;height:34px}
.fold{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.filebox{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--text)}
.filebox svg{width:64px;height:64px}
</style>

<script>
/* ============ icons ============ */

 plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',back:'<path d="m15 18-6-6 6-6"/>',next:'<path d="m9 18 6-6-6-6"/>',

};
function ico(n,c){ if(n==='play') return '<svg class="i fill" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>'; return '<svg class="i '+(c||'')+'" viewBox="0 0 24 24">'+P[n]+'</svg>'; }

/* ============ state & helpers ============ */
var S={view:localStorage.getItem('albumView')||'list',filter:'all',filterFor:'',asSticker:false,usage:null,key:localStorage.getItem('albumKey')||'',db:{categories:{},meta:{},folders:[]},status:null,manage:false,q:'',upTab:'device',upFolder:'',pickFolder:'',uploads:[],loaded:false};
var COLORS=['#ff3d9a','#ffb020','#22d3ee','#34e3a0','#8b5cf6','#ff6b4a','#b6f04a'];

var PRESET=[['Funny Video','🎬'],['Islamic Video','🌙'],['Sad Video','💔'],['Anime Video','🎎'],['Cartoon Video','🐾'],['LoFi Video','🎧'],['Horny Video','🔥'],['Couple Video','💑'],['Flower Video','🌹'],['Random Photo','🖼️'],['Aesthetic Video','🌌'],['Sigma Rule','🦁'],['Lyrics Video','🎶'],['Cat Video','🐱'],['18+ Video','🚫'],['Free Fire Video','🎮'],['Football Video','⚽'],['Girl Video','👧'],['Friends Video','🤝'],['Cricket Video','🏏']];
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad2(n){return n<10?'0'+n:''+n}
function colorFor(k){var h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return COLORS[h%COLORS.length]}
function ago(t){if(!t)return'';var s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'}
function kindLabel(k){return typeOf(k).one}
function isBlob(u){return /\.public\.blob\.vercel-storage\.com\//.test(u||'')}
function folderOf(k){return S.db.folders.filter(function(f){return f.key===k})[0]}
function itemsOf(k){return S.db.categories[k]||[]}
function api(path,opt){
  opt=opt||{};opt.headers=Object.assign({'x-api-key':S.key},opt.headers||{});
  return fetch(path,opt).then(function(r){return r.text().then(function(t){var j={};try{j=JSON.parse(t)}catch(e){j={error:t.slice(0,120)}}
    if(r.status===401&&S.loaded){logout();throw new Error('Session expired')}
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j})});
}
function post(p,b){return api(p,{method:'POST',body:JSON.stringify(b)})}
function toast(msg,type){
  var el=document.createElement('div');el.className='toast '+(type||'');el.textContent=msg;$('toasts').appendChild(el);
  setTimeout(function(){el.classList.add('out');setTimeout(function(){el.remove()},300)},type==='err'?5200:2800);
}
function countUp(el){var to=+el.dataset.to||0,t0=performance.now();(function f(t){var p=Math.min(1,(t-t0)/700);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
document.addEventListener('pointerdown',function(e){var b=e.target.closest('.btn');if(!b)return;var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');
  s.className='rip';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';b.appendChild(s);setTimeout(function(){s.remove()},600)});

/* ============ modals ============ */
function modal(html,mount){
  var el=document.createElement('div');el.className='modal';el.innerHTML='<div class="sheet">'+html+'</div>';$('modalRoot').appendChild(el);
  requestAnimationFrame(function(){el.classList.add('on')});
  function close(v){el.classList.remove('on');setTimeout(function(){el.remove()},300);if(el._res){var r=el._res;el._res=null;r(v)}}
  el.addEventListener('click',function(e){if(e.target===el)close(null)});
  var p=new Promise(function(res){el._res=res});mount&&mount(el,close);return p;
}
function ask(title,val,ph,ok){
  return modal('<h3>'+esc(title)+'</h3><input class="field" id="mi" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'"><div class="row"><button class="btn ghost" data-m="x">Cancel</button><button class="btn primary" data-m="ok">'+esc(ok||'Save')+'</button></div>',function(el,close){

}
function confirmBox(title,text,ok){

}
function pickFolder(title,except){
  var list=S.db.folders.filter(function(f){return f.key!==except});
  var h='<h3>'+esc(title)+'</h3><div class="plist">'+list.map(function(f){return '<button data-k="'+esc(f.key)+'"><span style="font-size:22px">'+esc(f.icon)+'</span><b style="flex:1">'+esc(f.title)+'</b><span class="muted">'+f.count+'</span></button>'}).join('')+'</div><div class="row"><button class="btn ghost" data-m="x">Cancel</button></div>';
  return modal(h,function(el,close){el.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){close(b.dataset.k)}});el.querySelector('[data-m=x]').onclick=function(){close(null)}});
}
function folderForm(f){
  var icon=(f&&f.icon)||'📁';
  var h='<h3>'+(f?'Edit folder':'New folder')+'</h3><input class="field" id="ft" placeholder="Folder name (e.g. Cricket Video)" value="'+esc(f?f.title:'')+'"><div class="emo">'+EMOJIS.map(function(e){return '<button type="button" data-e="'+e+'" class="'+(e===icon?'on':'')+'">'+e+'</button>'}).join('')+'</div><div class="row"><button class="btn ghost" data-m="x">Cancel</button><button class="btn primary" data-m="ok">'+(f?'Save':'Create')+'</button></div>';
  return modal(h,function(el,close){
    var t=el.querySelector('#ft');setTimeout(function(){t.focus()},350);
    el.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){icon=b.dataset.e;el.querySelectorAll('[data-e]').forEach(function(x){x.classList.toggle('on',x===b)})}});
    function ok(){if(!t.value.trim())return toast('Enter a folder name','err');close({title:t.value.trim(),icon:icon})}
    t.addEventListener('keydown',function(e){if(e.key==='Enter')ok()});
    el.querySelector('[data-m=ok]').onclick=ok;el.querySelector('[data-m=x]').onclick=function(){close(null)};
  });
}
function linkSheet(folderKey){
  var f=folderOf(folderKey);
  return modal('<h3>Add by link to '+esc(f?f.icon+' '+f.title:'folder')+'</h3><textarea class="field" id="lk" placeholder="Paste catbox or any media links, one per line"></textarea><label style="display:flex;gap:10px;margin-top:10px;align-items:flex-start" class="muted small"><input type="checkbox" id="cp" checked style="width:20px;height:20px;accent-color:#ff3d9a;margin-top:2px"><span>Copy to my own storage so the link never dies. Catbox links are always kept as they are.</span></label><div class="row"><button class="btn ghost" data-m="x">Cancel</button><button class="btn primary" data-m="ok">Add</button></div>',function(el,close){
    el.querySelector('[data-m=ok]').onclick=function(){var v=el.querySelector('#lk').value.trim();if(!v)return toast('Paste at least one link','err');close({text:v,copy:el.querySelector('#cp').checked})};
    el.querySelector('[data-m=x]').onclick=function(){close(null)};
  });
}

/* ============ data ============ */
function load(){return api('/api/all').then(function(d){S.db=d;S.loaded=true;return d})}
function refresh(){return load().then(function(){render(true);}).catch(function(e){toast(e.message,'err')})}
function loadStatus(){return api('/api/status').then(function(s){S.status=s;chips();return s}).catch(function(){})}
function chips(){
  var s=S.status;if(!s){$('chips').innerHTML='';return}
  $('chips').innerHTML='<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip '+(s.redis?'ok':'')+'"><i></i>Database</span><span class="chip '+(s.blob?'ok':'')+'"><i></i>Storage</span></div>';
}

/* ============ auth ============ */
function login(){
  S.key=$('key').value.trim();if(!S.key)return toast('Enter the password','err');
  api('/api/all').then(function(d){S.db=d;S.loaded=true;localStorage.setItem('albumKey',S.key);enter()}).catch(function(e){S.loaded=false;toast(e.message==='wrong or missing key'?'Wrong password, try again':e.message,'err')});
}
function logout(){localStorage.removeItem('albumKey');S.key='';location.hash='';location.reload()}
function enter(){
  $('login').style.display='none';$('shell').classList.add('on');
  buildNav();loadStatus();if(!location.hash)location.hash='#/';go();
}
function buildNav(){
  var items=[['','folder','Folders'],['upload','upload','Upload'],['settings','gear','Settings']];
  $('sideNav').innerHTML=items.map(function(i){return '<button data-nav="'+i[0]+'">'+ico(i[1])+i[2]+'</button>'}).join('');
  $('tabs').innerHTML=items.map(function(i){return '<button class="tab" data-nav="'+i[0]+'">'+ico(i[1])+i[2]+'</button>'}).join('');
  document.querySelector('.sidefoot .btn').innerHTML=ico('logout')+'Log out';
}

/* ============ router ============ */
function parse(){var h=location.hash.replace(/^#\/?/,'');var a=h.split('/');return{v:a[0]||'home',k:decodeURIComponent(a.slice(1).join('/')||'')}}
function go(){render(false)}
window.addEventListener('hashchange',function(){if(S.loaded)go()});
function render(keep){
  var r=parse(),v=$('view'),html;
  document.querySelectorAll('[data-nav]').forEach(function(b){var n=b.dataset.nav;b.classList.toggle('on',(n===''&&(r.v==='home'||r.v==='folder'||r.v==='library'))||n===r.v)});
  if(r.v==='folder'){if(!folderOf(r.k)){location.hash='#/';return}html=vFolder(r.k)}
  else if(r.v==='library')html=vLibrary(r.k||'all');
  else if(r.v==='upload')html=vUpload();
  else if(r.v==='settings')html=vSettings();
  else html=vHome();
  v.innerHTML=html;
  if(keep){var pg=v.firstElementChild;if(pg)pg.style.animation='none'}
  v.querySelectorAll('[data-to]').forEach(countUp);
  animateDonut();
  lazy();
  if(r.v==='home'||r.v==='settings'){fillUsage();if(!keep||!S.usage)loadUsage(false)}
  if(!keep)window.scrollTo({top:0});
  if(r.v==='settings')loadStatus().then(function(){var c=$('stBox');if(c)c.innerHTML=stBox()});
}
var io=null;
function lazy(){
  if(!io)io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var t=e.target;if(t.dataset.src){t.src=t.dataset.src;t.removeAttribute('data-src')}io.unobserve(t)}})},{rootMargin:'200px'});
  document.querySelectorAll('[data-src]').forEach(function(el){io.observe(el)});
}


function fmt(n){if(n==null||isNaN(n))return'-';var u=['B','KB','MB','GB','TB'],i=0;n=Number(n);while(n>=1024&&i<4){n/=1024;i++}return(i>=3?n.toFixed(2):i>=1?n.toFixed(1):Math.round(n))+' '+u[i]}
function meter(label,icon,used,limit,note){
  var pct=limit?Math.min(100,used/limit*100):0,cls=pct>=90?'bad':pct>=70?'warn':'';
  return '<div class="meter"><div class="mh"><b>'+icon+' '+esc(label)+'</b><span class="muted small">'+(limit?(pct<1&&used>0?'<1':Math.round(pct))+'% full':'Unlimited')+'</span></div><div class="mbar"><i class="'+cls+'" data-w="'+(limit?Math.max(pct,used>0?2:0):3)+'"></i></div><div class="mf small"><span>'+fmt(used)+' used</span><span>'+(limit?fmt(Math.max(0,limit-used))+' free of '+fmt(limit):'no limit')+'</span></div>'+(note?'<div class="muted small" style="margin-top:4px">'+esc(note)+'</div>':'')+'</div>';
}
function storageHtml(u){
  if(!u)return'<div class="skel"></div><div class="skel"></div>';
  var h='';
  if(!u.blob.connected)h+='<div class="mrow2 small muted">My storage: not connected yet</div>';
  else if(u.blob.error)h+='<div class="mrow2 small" style="color:var(--amber)">My storage: could not read usage ('+esc(u.blob.error)+')</div>';
  else h+=meter('My storage (Vercel)','💾',u.blob.used||0,u.blob.limit,(u.blob.count||0)+' file'+(u.blob.count===1?'':'s'));
  if(!u.drive.connected)h+='<div class="mrow2 small muted">Google Drive: not connected (optional, adds 15GB)</div>';
  else if(!u.drive.ok)h+='<div class="mrow2 small" style="color:var(--amber)">Google Drive: '+esc(u.drive.error||'not working')+'</div>';
  else h+=meter('Google Drive','☁️',u.drive.usage||0,u.drive.limit,u.drive.email||'');
  if(u.catbox&&u.catbox.count)h+='<div class="mrow2 small muted">🔗 Catbox: '+u.catbox.count+' file'+(u.catbox.count===1?'':'s')+' kept as links (size not counted)</div>';
  return h;
}
function destHtml(u){
  if(!u)return'';
  var o=[['auto','Auto'],['blob','My storage'],['drive','Google Drive']];
  var now={blob:'My storage',drive:'Google Drive'}[u.dest]||'My storage';
  return '<div class="seg" style="margin:12px 0 8px">'+o.map(function(x){return '<button data-act="dest" data-v="'+x[0]+'" class="'+(u.setting===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div><div class="muted small">New uploads go to: <b style="color:var(--text)">'+now+'</b>'+(u.setting==='auto'?' (Auto uses My storage until it is 90% full, then Google Drive)':'')+'</div>';
}
function loadUsage(fresh){
  return api('/api/usage'+(fresh?'?fresh=1':'')).then(function(u){S.usage=u;fillUsage();return u}).catch(function(){});
}
function fillUsage(){
  var a=$('storBody');if(a){a.innerHTML=storageHtml(S.usage)}
  var b=$('storSet');if(b){b.innerHTML=storageHtml(S.usage)+destHtml(S.usage)}
  document.querySelectorAll('.mbar i[data-w]').forEach(function(el){requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.width=el.dataset.w+'%'})})});
}
/* ============ views ============ */
function owner(){return '<div class="hero"><div class="avatar"><i class="crown">👑</i><b>JV</b></div><div><span class="badge">Owner</span><h1 class="oname">JABED VAO</h1><p class="sub">Album Studio</p></div></div>'}
var TYPES=[
 {k:'video',label:'Videos',one:'Video',ico:'film',c:'#ff3d9a'},
 {k:'photo',label:'Photos',one:'Photo',ico:'image',c:'#22d3ee'},
 {k:'audio',label:'Audio',one:'Audio',ico:'music',c:'#ffb020'},
 {k:'gif',label:'GIFs',one:'GIF',ico:'gif',c:'#34e3a0'},
 {k:'sticker',label:'Stickers',one:'Sticker',ico:'sticker',c:'#8b5cf6'},
 {k:'file',label:'Other',one:'File',ico:'file',c:'#b5aae3'}];
function typeOf(k){for(var i=0;i<TYPES.length;i++)if(TYPES[i].k===k)return TYPES[i];return TYPES[5]}
function statsAll(){
  var t={total:0,bytes:0,by:{}};TYPES.forEach(function(x){t.by[x.k]={n:0,bytes:0}});
  S.db.folders.forEach(function(f){itemsOf(f.key).forEach(function(it){var k=typeOf(it.kind).k;t.by[k].n++;t.total++;if(it.size){t.by[k].bytes+=it.size;t.bytes+=it.size}})});
  return t;
}
function countsOf(key){var c={};TYPES.forEach(function(t){c[t.k]=0});itemsOf(key).forEach(function(it){c[typeOf(it.kind).k]++});return c}
function tchips(c){return TYPES.filter(function(t){return c[t.k]}).map(function(t){return '<span class="tc" style="--c:'+t.c+'">'+ico(t.ico)+c[t.k]+'</span>'}).join('')}
function donut(st){
  var R=52,C=2*Math.PI*R,off=0,segs='';
  TYPES.forEach(function(t){var n=st.by[t.k].n;if(!n||!st.total)return;var len=n/st.total*C;
    segs+='<circle class="seg" cx="60" cy="60" r="52" fill="none" stroke="'+t.c+'" stroke-width="14" stroke-linecap="butt" data-len="'+len.toFixed(2)+'" data-c="'+C.toFixed(2)+'" stroke-dasharray="0 '+C.toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';off+=len});
  return '<svg viewBox="0 0 120 120" class="donut"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>'+segs+'</svg>';
}
function animateDonut(){
  document.querySelectorAll('circle.seg[data-len]').forEach(function(el){requestAnimationFrame(function(){requestAnimationFrame(function(){
    var len=parseFloat(el.dataset.len),c=el.dataset.c;el.setAttribute('stroke-dasharray',Math.max(0,len-(len>4?2:0))+' '+c)})})});
}
function recentHtml(){
  var all=[];S.db.folders.forEach(function(f){itemsOf(f.key).forEach(function(it,i){all.push({it:it,k:f.key,i:i,f:f})})});
  all.sort(function(a,b){return (b.it.added||0)-(a.it.added||0)});all=all.slice(0,8);
  if(!all.length)return'';
  return '<h2 class="t">'+ico('play')+'Recently added</h2><div class="rstrip">'+all.map(function(x,n){var t=typeOf(x.it.kind);
    return '<div class="rcard" style="--c:'+t.c+';animation-delay:'+(n*50)+'ms" data-act="play" data-k="'+esc(x.k)+'" data-i="'+x.i+'"><div class="thumb">'+thumb(x.it)+'</div><div class="rl"><span class="kind" style="--c:'+t.c+'">'+t.one+'</span>'+esc(x.f.icon)+' #'+(x.i+1)+'</div></div>'}).join('')+'</div>';
}
function vHome(){
  var fs=S.db.folders,st=statsAll();
  var q=S.q.toLowerCase();var list=fs.filter(function(f){return !q||f.title.toLowerCase().indexOf(q)>-1});
  var h='<div class="page">'+owner();
  h+='<div class="card lib" style="margin-top:14px"><div class="libtop"><div class="dw">'+donut(st)+'<div class="dc"><b data-to="'+st.total+'">0</b><span>items</span></div></div><div class="li"><h3 style="margin:0 0 6px">'+ico('folder')+'My library</h3><div class="muted small">'+fs.length+' folder'+(fs.length===1?'':'s')+'</div>'+(st.bytes?'<div class="muted small">Known size: '+fmt(st.bytes)+'</div>':'')+'<button class="btn ghost" style="margin-top:10px;padding:7px 14px;font-size:13.5px" data-act="lib" data-t="all">See everything</button></div></div>'+
    '<div class="tiles">'+TYPES.map(function(t){var d=st.by[t.k];return '<button class="tile" data-act="lib" data-t="'+t.k+'" style="--c:'+t.c+'"><span class="tic">'+ico(t.ico)+'</span><b data-to="'+d.n+'">0</b><span class="tl">'+t.label+'</span>'+(d.bytes?'<small>'+fmt(d.bytes)+'</small>':'')+'</button>'}).join('')+'</div></div>';
  h+='<div class="card"><h3>'+ico('db')+'Storage <button class="btn ghost" style="margin-left:auto;padding:6px 12px;font-size:13px" data-nav="settings">Details</button></h3><div id="storBody">'+storageHtml(S.usage)+'</div></div>';
  h+=recentHtml();
  h+='<h2 class="t">🎵 Album Folders 🎶</h2><div class="bar"><div class="search">'+ico('search')+'<input class="field" id="q" placeholder="Search folders" value="'+esc(S.q)+'"></div><button class="btn primary" data-act="newFolder">'+ico('plus')+'New folder</button>'+(fs.length?'<button class="btn ghost" data-act="manage">'+(S.manage?'Done':'Manage')+'</button>':'')+'</div>';
  if(!fs.length){
    h+='<div class="empty"><span class="big">📂</span><h3>No folders yet</h3><p>Create your first folder, or add all 20 starter folders in one tap.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn amber" data-act="preset">Create my 20 folders</button><button class="btn ghost" data-act="newFolder">'+ico('plus')+'New folder</button></div></div>';
  } else {
    h+='<ol class="flist" id="flist">'+flist(list)+'</ol>';
  }
  return h+'</div>';
}
function flist(list){
  if(!list.length)return '<div class="empty"><h3>No match</h3></div>';
  return list.map(function(f,i){
    var n=S.db.folders.indexOf(f)+1;
    return '<li class="frow" style="--i:'+i+';--c:'+colorFor(f.key)+'"><button class="fmain" data-act="open" data-k="'+esc(f.key)+'"><span class="num">'+pad2(n)+'</span><span class="ficon">'+esc(f.icon)+'</span><span class="ftitle">'+esc(f.title)+'<span class="fsub">'+tchips(countsOf(f.key))+'</span></span><span class="fcount">'+f.count+'</span>'+(S.manage?'':ico('next'))+'</button>'+
      (S.manage?'<div class="manage"><button class="ib" aria-label="Move up" data-act="fup" data-k="'+esc(f.key)+'">'+ico('up')+'</button><button class="ib" aria-label="Move down" data-act="fdown" data-k="'+esc(f.key)+'">'+ico('down')+'</button><button class="ib" aria-label="Edit folder" data-act="fedit" data-k="'+esc(f.key)+'">'+ico('edit')+'</button><button class="ib red" aria-label="Delete folder" data-act="fdel" data-k="'+esc(f.key)+'">'+ico('trash')+'</button></div>':'')+'</li>';
  }).join('');
}
function thumb(it){
  var u=esc(it.url),k=typeOf(it.kind).k;
  if(k==='video')return '<video data-src="'+u+'#t=0.1" muted playsinline preload="metadata"></video><span class="pl">'+ico('play')+'</span>';
  if(k==='photo'||k==='gif'||k==='sticker')return '<img data-src="'+u+'" alt="">';
  if(k==='audio')return '<div class="aud">'+ico('music')+'</div><span class="pl">'+ico('play')+'</span>';
  return '<div class="aud" style="background:linear-gradient(135deg,#43338c,#2a1b6e)">'+ico('file')+'</div>';
}
function mediaRow(it,k,i,showF,f,idx){
  var t=typeOf(it.kind),n=i+1,name=esc(it.name||(t.one+' '+n));
  var acts='<button class="ib" aria-label="Open" data-act="play" data-k="'+esc(k)+'" data-i="'+i+'">'+ico('play')+'</button><button class="ib" aria-label="Download" data-act="dl" data-k="'+esc(k)+'" data-i="'+i+'">'+ico('download')+'</button><button class="ib" aria-label="Rename" data-act="ren" data-id="'+it.id+'">'+ico('edit')+'</button><button class="ib" aria-label="Change type" data-act="tag" data-id="'+it.id+'">'+ico('tag')+'</button><button class="ib" aria-label="Move to another folder" data-act="mv" data-id="'+it.id+'" data-k="'+esc(k)+'">'+ico('move')+'</button><button class="ib" aria-label="Copy link" data-act="cp" data-k="'+esc(k)+'" data-i="'+i+'">'+ico('copy')+'</button><button class="ib red" aria-label="Delete" data-act="del" data-id="'+it.id+'">'+ico('trash')+'</button>';
  if(S.view==='grid'&&!showF){
    return '<div class="mcard" style="--i:'+Math.min(idx,14)+';--c:'+t.c+'"><span class="bn">#'+n+'</span><div class="thumb" data-act="play" data-k="'+esc(k)+'" data-i="'+i+'">'+thumb(it)+'</div><div class="kt"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+name+'</b><span class="kind" style="--c:'+t.c+';margin:0">'+t.one+'</span></div><div class="macts">'+acts+'</div></div>';
  }
  return '<div class="mrow" style="--i:'+Math.min(idx,14)+';--c:'+t.c+'"><div class="mnum">#'+n+'</div><div class="thumb" data-act="play" data-k="'+esc(k)+'" data-i="'+i+'">'+thumb(it)+'</div><div class="minfo"><b>'+name+'</b><div class="muted small"><span class="kind" style="--c:'+t.c+'">'+t.one+'</span>'+(it.size?fmt(it.size)+', ':'')+ago(it.added)+'</div>'+(showF?'<div class="fold">'+esc(f.icon)+' '+esc(f.title)+'</div>':'')+'</div><div class="macts">'+acts+'</div></div>';
}
function filterChips(cnt,total,cur,act){
  return '<div class="fchips">'+['all'].concat(TYPES.map(function(x){return x.k}).filter(function(x){return cnt[x]})).map(function(x){
    var t=x==='all'?{label:'All',c:'#ffffff'}:typeOf(x);
    return '<button class="fc '+(cur===x?'on':'')+'" data-act="'+act+'" data-f="'+x+'" data-t="'+x+'" style="--c:'+t.c+'">'+t.label+'<b>'+(x==='all'?total:cnt[x])+'</b></button>'}).join('')+'</div>';
}
function vFolder(k){
  var f=folderOf(k),items=itemsOf(k),c=colorFor(k),cnt=countsOf(k);
  if(S.filterFor!==k){S.filterFor=k;S.filter='all'}
  if(S.filter!=='all'&&!cnt[S.filter])S.filter='all';
  var h='<div class="page" style="--c:'+c+'"><div class="fhead"><button class="ib" aria-label="Back" data-act="back">'+ico('back')+'</button><div class="ti"><h2><span class="e">'+esc(f.icon)+'</span>'+esc(f.title)+'</h2><div class="muted small">'+items.length+' item'+(items.length===1?'':'s')+'</div></div><button class="ib" aria-label="Switch view" data-act="viewtoggle">'+ico(S.view==='grid'?'list':'grid')+'</button></div>';
  if(items.length)h+='<div class="tcrow">'+tchips(cnt)+'</div>';
  h+='<div class="bar"><button class="btn primary" data-act="pick" data-k="'+esc(k)+'">'+ico('upload')+'Upload</button><button class="btn cyan" data-act="addlink" data-k="'+esc(k)+'">'+ico('link')+'Add link</button><button class="btn ghost" data-act="fedit" data-k="'+esc(k)+'">'+ico('edit')+'Edit folder</button><button class="btn ghost" data-act="fdel" data-k="'+esc(k)+'">'+ico('trash')+'Delete folder</button></div>';
  if(!items.length){
    h+='<div class="drop" data-act="pick" data-k="'+esc(k)+'">'+ico('upload')+'<h3 style="margin:8px 0 2px;color:var(--text)">This folder is empty</h3><div>Drop videos, photos, audio, gifs or files here, or tap to upload</div></div>';
  } else {
    h+=filterChips(cnt,items.length,S.filter,'filter');
    var shown=[];items.forEach(function(it,i){if(S.filter==='all'||typeOf(it.kind).k===S.filter)shown.push([it,i])});
    var rows=shown.map(function(x,idx){return mediaRow(x[0],k,x[1],false,f,idx)}).join('');
    h+=S.view==='grid'?'<div class="mgrid">'+rows+'</div>':rows;
  }
  return h+'</div>';
}
function vLibrary(kk){
  var t=kk==='all'?{label:'Everything',ico:'folder'}:typeOf(kk);
  var rows=[],cnt={};TYPES.forEach(function(x){cnt[x.k]=0});
  S.db.folders.forEach(function(f){itemsOf(f.key).forEach(function(it,i){var tk=typeOf(it.kind).k;cnt[tk]++;if(kk==='all'||tk===kk)rows.push({it:it,k:f.key,i:i,f:f})})});
  var total=0;TYPES.forEach(function(x){total+=cnt[x.k]});
  var h='<div class="page"><div class="fhead"><button class="ib" aria-label="Back" data-act="back">'+ico('back')+'</button><div class="ti"><h2>'+ico(t.ico)+' '+t.label+'</h2><div class="muted small">'+rows.length+' item'+(rows.length===1?'':'s')+' across all folders</div></div></div>';
  h+=filterChips(cnt,total,kk,'lib');
  if(!rows.length)h+='<div class="empty"><span class="big">🫥</span><h3>Nothing here yet</h3><p>Upload some '+t.label.toLowerCase()+' and they will show up here.</p></div>';
  else h+=rows.map(function(x,idx){return mediaRow(x.it,x.k,x.i,true,x.f,idx)}).join('');
  return h+'</div>';
}
function pickType(cur){
  var h='<h3>Change type</h3><div class="plist">'+TYPES.map(function(t){return '<button data-k="'+t.k+'" style="'+(t.k===cur?'border-color:var(--pink)':'')+'"><span style="color:'+t.c+'">'+ico(t.ico)+'</span><b style="flex:1">'+t.one+'</b></button>'}).join('')+'</div><div class="row"><button class="btn ghost" data-m="x">Cancel</button></div>';
  return modal(h,function(el,close){el.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){close(b.dataset.k)}});el.querySelector('[data-m=x]').onclick=function(){close(null)}});
}
function vUpload(){
  var fs=S.db.folders;if(!S.upFolder||!folderOf(S.upFolder))S.upFolder=fs.length?fs[0].key:'';
  var h='<div class="page"><h2 class="t">'+ico('upload')+'Add media</h2>';

  if(S.upTab!=='bot'){

/* ============ uploads ============ */
var jobs=[],running=0;
function kindOf(f){var t=f.type||'';if(t.indexOf('video')===0)return'video';if(t.indexOf('audio')===0)return'audio';if(t==='image/gif'||/\.gif$/i.test(f.name))return'gif';if(t.indexOf('image')===0)return'photo';
  var e=(f.name.split('.').pop()||'').toLowerCase();if(['mp4','mov','webm','mkv','3gp'].indexOf(e)>-1)return'video';if(['mp3','m4a','ogg','wav','opus','aac'].indexOf(e)>-1)return'audio';return /^(jpe?g|png|webp|bmp|heic|avif)$/.test(e)?'photo':'file'}
function kindForUpload(f){var k=kindOf(f);return(S.asSticker&&(k==='photo'||k==='gif'))?'sticker':k}
function enqueue(files,folderKey){
  if(!folderKey||!folderOf(folderKey))return toast('Choose a folder first','err');
  var list=Array.prototype.slice.call(files);
  api('/api/dest').then(function(d){
    if(d.dest==='blob'&&S.status&&!S.status.blob){toast('No storage is connected yet. See Settings.','err');return}
    list.forEach(function(f){var u={id:Math.random().toString(36).slice(2),name:f.name,kind:kindForUpload(f),folder:folderKey,dest:d.dest,pct:0,st:'wait',msg:''};S.uploads.push(u);jobs.push({u:u,f:f})});
    tray();pump();
  }).catch(function(e){toast(e.message,'err')});
}
function pump(){while(running<2&&jobs.length){var j=jobs.shift();running++;doUpload(j).then(function(){},function(){}).then(function(){running--;pump()})}}
var LIB=null;
function getLib(){
  if(LIB)return Promise.resolve(LIB);
  var urls=['https://esm.sh/@vercel/blob@1/client','https://esm.run/@vercel/blob@1/client','https://cdn.skypack.dev/@vercel/blob@1/client'],errs=[],i=0;
  function next(){
    if(i>=urls.length)return Promise.reject(new Error('Could not load the uploader ('+errs.join('; ')+'). Check your internet and try again.'));
    var u=urls[i++];
    return import(u).then(function(m){if(m&&m.upload){LIB=m;return m}throw new Error('bad module')}).catch(function(e){errs.push(u.split('/')[2]+': '+(e&&e.message||e));return next()});
  }
  return next();
}
function hint(msg){
  msg=String(msg||'');
  if(/private/i.test(msg))return msg+' (Your Blob store looks Private. Create a new Blob store and choose Public.)';
  if(/not connected|BLOB_READ_WRITE_TOKEN|token/i.test(msg)&&!/expired/i.test(msg))return msg+' (Connect a Blob store to this project, then Redeploy.)';
  if(/expired/i.test(msg))return msg+' (Upload took too long. Redeploy once and try again.)';
  return msg;
}
function blobUpload(f,u){
  return getLib().then(function(m){
    var safe=f.name.replace(/[^\w.\-]/g,'_');
    return m.upload('album/'+safe,f,{access:'public',handleUploadUrl:'/api/blob-upload',clientPayload:S.key,multipart:f.size>5*1024*1024,onUploadProgress:function(p){u.pct=p.percentage;tray()}});
  }).then(function(b){return b.url});
}
function driveUpload(f,u){
  var ext=(f.name.split('.').pop()||'bin').toLowerCase(),type=f.type||'application/octet-stream';
  return fetch('/api/drive/session',{method:'POST',headers:{'x-api-key':S.key,'Content-Type':'application/json'},body:JSON.stringify({name:f.name,type:type,size:f.size})})
    .then(function(r){return r.json().then(function(j){if(!r.ok||!j.sessionUrl)throw new Error('Google Drive: '+(j.error||('HTTP '+r.status)));return j.sessionUrl})})
    .then(function(sessionUrl){return new Promise(function(res,rej){
      var x=new XMLHttpRequest();x.open('PUT',sessionUrl);x.setRequestHeader('Content-Type',type);
      x.upload.onprogress=function(e){if(e.lengthComputable){u.pct=e.loaded/e.total*100;tray()}};
      x.onload=function(){if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText))}catch(e){rej(new Error('Unexpected answer from Google'))}}else rej(new Error('Google upload failed (HTTP '+x.status+')'))};
      x.onerror=function(){rej(new Error('Network error while uploading to Google Drive'))};
      x.send(f);
    })})
    .then(function(file){return location.origin+'/api/dfile/'+file.id+'.'+ext});
}
function doUpload(j){
  var u=j.u,f=j.f;u.st='up';tray();
  function saveLink(url){return post('/api/add',{category:u.folder,url:url,kind:u.kind,size:f.size})}
  var first=u.dest==='drive'
    ? driveUpload(f,u).then(saveLink).catch(function(err){
        if(S.status&&S.status.blob){u.pct=0;u.msg='Drive failed, using my storage...';tray();return blobUpload(f,u).then(saveLink)}
        throw err;
      })
    : blobUpload(f,u).then(saveLink);
  return first.catch(function(err){
    if(u.dest!=='drive'&&f.size<=4*1024*1024){ // fallback through the server for small files
      return fetch('/api/upload?category='+encodeURIComponent(u.folder)+'&name='+encodeURIComponent(f.name),{method:'POST',headers:{'x-api-key':S.key,'Content-Type':'application/octet-stream'},body:f}).then(function(r){return r.json().then(function(x){if(!r.ok)throw new Error(x.error||'upload failed');return x})});
    }
    throw err;
  }).then(function(){u.st='done';u.pct=100;u.msg='';tray();scheduleRefresh();S.usage=null},function(e){u.st='err';u.msg=hint(e&&e.message||'failed');tray()});
}
var rt=null;function scheduleRefresh(){clearTimeout(rt);rt=setTimeout(refresh,500)}
function tray(){
  var t=$('tray');if(!S.uploads.length){t.className='';t.innerHTML='';return}
  var done=S.uploads.filter(function(u){return u.st==='done'}).length;
  t.className='on';
  t.innerHTML='<div class="trbox"><div class="trhead"><span>Uploads '+done+'/'+S.uploads.length+'</span><button class="ib" data-act="trayclear" aria-label="Close">'+ico('x')+'</button></div>'+S.uploads.map(function(u){
    return '<div class="up '+u.st+'"><div class="n"><span>'+esc(u.name)+'</span><span>'+(u.st==='done'?'Done':u.st==='err'?'Failed':u.st==='wait'?'Waiting':Math.round(u.pct)+'%')+'</span></div><div class="pb"><i style="width:'+(u.st==='wait'?0:Math.max(u.pct,4))+'%"></i></div>'+(u.msg?'<div class="small" style="color:var(--danger);margin-top:4px">'+esc(u.msg)+'</div>':'')+'</div>'}).join('')+'</div>';
}
async function addLinks(text,folderKey,copy){
  var urls=text.split(/\s+/).filter(function(x){return /^https?:\/\//i.test(x)});
  if(!folderKey||!folderOf(folderKey))return toast('Choose a folder first','err');
  if(!urls.length)return toast('No valid links found','err');
  toast('Checking '+urls.length+' link'+(urls.length>1?'s':'')+'...');
  var ok=0,bad=[],warn=0;
  for(var i=0;i<urls.length;i++){
    var c=null;try{c=await api('/api/check?url='+encodeURIComponent(urls[i]))}catch(e){}
    if(c&&c.ok===false){bad.push('HTTP '+c.status);continue}
    if(c&&c.ok===null)warn++;
    try{await post('/api/add',{category:folderKey,url:urls[i],fetch:copy});ok++}catch(e){bad.push(e.message)}
  }
  await refresh();
  if(ok&&!bad.length)toast(ok+' added'+(warn?' (server could not verify '+warn+', saved anyway)':''),'ok');
  else if(ok)toast(ok+' added, '+bad.length+' failed: '+bad[0],'');
  else toast('Link not working: '+(bad[0]||'unknown error')+'. Use a direct file link such as https://files.catbox.moe/abc123.mp4','err');
}


async function runDiag(){
  var out=$('diagOut');var rows=[];
  function show(){out.innerHTML=rows.map(function(r){return '<div style="display:flex;gap:10px;margin-bottom:8px"><span style="flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#10253a;background:'+(r.s==='ok'?'var(--ok)':r.s==='bad'?'var(--danger)':'var(--amber)')+'">'+(r.s==='ok'?'&#10003;':r.s==='bad'?'!':'&hellip;')+'</span><div style="min-width:0"><b>'+esc(r.t)+'</b>'+(r.m?'<div class="small muted" style="word-break:break-word">'+esc(r.m)+'</div>':'')+'</div></div>'}).join('')}
  async function step(t,fn){var r={t:t,s:'run',m:''};rows.push(r);show();try{var m=await fn();r.s='ok';r.m=m||''}catch(e){r.s='bad';r.m=hint(e&&e.message||String(e));show();return false}show();return true}
  rows=[];
  var st=null;
  if(!await step('1. Server and database',async function(){st=await api('/api/status');if(!st.redis)throw new Error('Database is not connected');return 'Database connected'}))return;
  if(!await step('2. Storage connected',async function(){if(!st.blob)throw new Error('Storage (Blob) is not connected. In Vercel: Storage, create a Blob store (Public), connect it to this project, then Redeploy.');return 'Blob token found'}))return;
  var lib=null;
  if(!await step('3. Load uploader',async function(){lib=await getLib();return 'Loaded'}))return;
  if(!await step('4. Upload token from server',async function(){var r=await fetch('/api/blob-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'blob.generate-client-token',payload:{pathname:'album/selftest.txt',clientPayload:S.key,multipart:false}})});var j=await r.json();if(!r.ok||!j.clientToken)throw new Error(j.error||('HTTP '+r.status));return 'Token received'}))return;
  var url='';
  if(!await step('5. Upload a small test file',async function(){var b=await lib.upload('album/selftest-'+Date.now()+'.txt',new Blob(['album test']),{access:'public',handleUploadUrl:'/api/blob-upload',clientPayload:S.key});url=b.url;return 'Saved'}))return;
  await step('6. Remove the test file',async function(){await api('/api/blob?url='+encodeURIComponent(url),{method:'DELETE'});return 'Removed'});
  await step('7. Can the server reach catbox?',async function(){var c=await api('/api/check?url='+encodeURIComponent('https://catbox.moe/'));if(c.ok===null)throw new Error('Not reachable from the server: '+c.error+'. Catbox links can still be saved as they are.');return 'Reachable (HTTP '+c.status+')'});
  rows.push({t:'All checks finished',s:'ok',m:'Uploading videos from your phone should work now.'});show();
}

function openViewer(k,i){
  var items=itemsOf(k);if(!items.length)return;var idx=i;
  var el=document.createElement('div');el.className='viewer';document.body.appendChild(el);requestAnimationFrame(function(){el.classList.add('on')});
  function show(){
    var it=items[idx];var m;
    if(it.kind==='video')m='<video src="'+esc(it.url)+'" controls autoplay playsinline></video>';
    else if(it.kind==='audio')m='<audio src="'+esc(it.url)+'" controls autoplay></audio>';
    else if(typeOf(it.kind).k==='file')m='<div class="filebox">'+ico('file')+'<b>'+esc(it.name||'File')+'</b><button class="btn primary" data-v="dl">'+ico('download')+'Download</button></div>';
    else m='<img src="'+esc(it.url)+'" alt="">';
    el.innerHTML='<div class="vtop"><b>#'+(idx+1)+'  '+esc(it.name||kindLabel(it.kind))+'</b><button class="ib" data-v="dl" aria-label="Download">'+ico('download')+'</button><button class="ib" data-v="x" aria-label="Close">'+ico('x')+'</button></div><div class="vbody">'+m+'</div><div class="vnav"><button class="btn ghost" data-v="prev">'+ico('back')+'Prev</button><button class="btn ghost" data-v="next">Next'+ico('next')+'</button></div>';
  }
  function close(){document.removeEventListener('keydown',key);el.classList.remove('on');setTimeout(function(){el.remove()},250)}
  function key(e){if(e.key==='Escape')close();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)}
  function step(d){idx=(idx+d+items.length)%items.length;show()}
  el.addEventListener('click',function(e){var b=e.target.closest('[data-v]');if(!b)return;var a=b.dataset.v;if(a==='x')close();else if(a==='prev')step(-1);else if(a==='next')step(1);else if(a==='dl')download(items[idx],idx+1)});
  document.addEventListener('keydown',key);show();
}
function download(it,n){
  var url=it.url;if(isBlob(url))url+=(url.indexOf('?')>-1?'&':'?')+'download=1';
  var ext=(it.url.split('?')[0].split('.').pop()||'').toLowerCase();if(ext.length>5)ext='bin';
  var a=document.createElement('a');a.href=url;a.download=(it.name||('media-'+n))+'.'+ext;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}

  else if(a==='diag'){runDiag()}
  else if(a==='dest'){post('/api/settings',{dest:b.dataset.v}).then(function(){return loadUsage(true)}).then(function(){toast('Saved','ok')}).catch(function(er){toast(er.message,'err')})}
  else if(a==='usagerefresh'){toast('Refreshing...');loadUsage(true).then(function(){toast('Updated','ok')})}
  else if(a==='export'){var blob=new Blob([JSON.stringify(S.db)],{type:'application/json'});var l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='album-backup.json';l.click()}
  else if(a==='import'){$('importFile').value='';$('importFile').click()}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;var l=$('flist');if(l)l.innerHTML=flist(S.db.folders.filter(function(f){return !S.q||f.title.toLowerCase().indexOf(S.q.toLowerCase())>-1}))}});
document.addEventListener('change',function(e){
  if(e.target.id==='asSt'){S.asSticker=e.target.checked;return}
  if(e.target.id==='upSel'){
    if(e.target.value==='__new'){e.target.value=S.upFolder;folderForm(null).then(function(r){if(!r)return;post('/api/folder',r).then(function(x){S.upFolder=x.key;return refresh()}).then(function(){toast('Folder created','ok')}).catch(function(er){toast(er.message,'err')})})}
    else S.upFolder=e.target.value;
  }
});
$('filePick').addEventListener('change',function(e){if(e.target.files.length)enqueue(e.target.files,S.pickFolder)});
$('importFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;
  confirmBox('Restore backup?','All current folders will be replaced by this backup.','Restore').then(function(ok){if(!ok)return;
    f.text().then(function(t){return api('/api/import',{method:'POST',body:t})}).then(refresh).then(function(){toast('Backup restored','ok')}).catch(function(er){toast(er.message,'err')})})});
$('key').addEventListener('keydown',function(e){if(e.key==='Enter')login()});

/* drag and drop */
['dragover','drop'].forEach(function(ev){document.addEventListener(ev,function(e){
  var r=parse();if(!(r.v==='folder'||r.v==='upload'))return;e.preventDefault();
  var z=e.target.closest&&e.target.closest('.drop');
  if(ev==='dragover'){document.querySelectorAll('.drop').forEach(function(d){d.classList.toggle('over',d===z)});return}
  document.querySelectorAll('.drop').forEach(function(d){d.classList.remove('over')});
  var fl=e.dataTransfer&&e.dataTransfer.files;if(fl&&fl.length)enqueue(fl,r.v==='folder'?r.k:S.upFolder);
})});
document.addEventListener('dragleave',function(e){if(!e.relatedTarget)document.querySelectorAll('.drop').forEach(function(d){d.classList.remove('over')})});

/* auto login */
if(S.key){api('/api/all').then(function(d){S.db=d;S.loaded=true;enter()}).catch(function(){S.loaded=false})}

/* ============ cinematic intro ============ */
(function(){
  var el=$('intro'),done=false,raf=0,cv=$('introCv'),ctx=cv.getContext('2d');
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.remove();return}
  var name='JABED VAO',nm=$('iname');
  for(var i=0;i<name.length;i++){var sp=document.createElement('span');sp.className='ch';sp.style.setProperty('--n',i);sp.textContent=name[i]===' '?'\u00a0':name[i];nm.appendChild(sp)}
  var W,H,parts=[],t0=performance.now(),dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
  size();window.addEventListener('resize',size);
  var cols=['#ff3d9a','#ffb020','#22d3ee','#34e3a0','#8b5cf6','#ffffff'];
  for(var k=0;k<120;k++)parts.push({a:Math.random()*6.283,r:Math.random()*80*dpr,v:.4+Math.random()*1.6,s:.6+Math.random()*1.8,c:cols[k%cols.length]});
  function frame(now){
    var t=(now-t0)/1000,boost=t<1.4?.35+t*1.1:1.6;
    ctx.fillStyle='rgba(8,3,26,.2)';ctx.fillRect(0,0,W,H);
    var cx=W/2,cy=H/2,max=Math.hypot(W,H)/2;
    for(var j=0;j<parts.length;j++){var p=parts[j];
      p.r+=p.v*boost*dpr*(1+p.r/(260*dpr));
      if(p.r>max){p.r=Math.random()*30*dpr;p.a=Math.random()*6.283}
      var x=cx+Math.cos(p.a)*p.r,y=cy+Math.sin(p.a)*p.r,sz=p.s*dpr*(1+p.r/(320*dpr));
      ctx.globalAlpha=Math.min(1,p.r/(120*dpr));ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=10*dpr;
      ctx.beginPath();ctx.arc(x,y,sz,0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    if(!done)raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  // loading bar 3.3s -> 4.5s
  var bar=$('ibar'),pct=$('ipct');
  function load(now){
    if(done)return;var t=(now-t0)/1000,p=Math.max(0,Math.min(1,(t-3.3)/1.2));
    var e=1-Math.pow(1-p,2);bar.style.width=(e*100)+'%';pct.textContent=Math.round(e*100)+'%';
    if(p>=1){setTimeout(end,350);return}requestAnimationFrame(load);
  }
  requestAnimationFrame(load);
  function end(){
    if(done)return;done=true;cancelAnimationFrame(raf);
    el.classList.add('out');
    var tgt=document.querySelector('#shell.on')||$('login');if(tgt){tgt.classList.add('reveal');setTimeout(function(){tgt.classList.remove('reveal')},900)}
    setTimeout(function(){el.remove()},750);
  }
  $('iskip').addEventListener('click',end);
  el.addEventListener('click',end);
})();
</script>
</body>
